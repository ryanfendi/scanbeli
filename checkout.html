<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#070707"
>

<title>Checkout — SCANBELI</title>

<link rel="stylesheet" href="style.css">

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(214,173,85,0.18),
      transparent 40%
    ),
    #070707;

  color: #fff;

  font-family:
    Inter,
    system-ui,
    sans-serif;
}

.page {

  width:
    calc(100% - 24px);

  max-width: 620px;

  margin: auto;

  padding:
    18px 0 70px;
}

.top {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  margin-bottom: 18px;
}

.logo {

  color: #f4d98b;

  font-size: 20px;

  font-weight: 900;

  letter-spacing: 2px;
}

.back {

  color: #999;

  font-size: 11px;
}

.loading,
.error,
.card {

  border-radius: 22px;

  border:
    1px solid
    rgba(214,173,85,0.14);

  background: #111;
}

.loading {

  padding: 28px;

  text-align: center;

  color: #999;
}

.error {

  padding: 22px;

  color: #ff7777;

  line-height: 1.6;

  font-size: 12px;
}

.hidden {
  display: none !important;
}

.card {

  padding: 21px;

  margin-top: 13px;

  background:
    linear-gradient(
      145deg,
      rgba(214,173,85,0.07),
      #111
    );
}

.badge {

  display: inline-block;

  padding: 6px 10px;

  border-radius: 30px;

  color: #f4d98b;

  background:
    rgba(214,173,85,0.08);

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;
}

.product h1 {

  margin:
    14px 0 5px;

  font-size: 28px;

  letter-spacing: -1px;
}

.product-code {

  color: #777;

  font-size: 10px;
}

.price {

  margin-top: 13px;

  color: #f4d98b;

  font-size: 25px;

  font-weight: 900;
}

.card-title {

  margin:
    13px 0 17px;

  font-size: 17px;
}

.data-row {

  margin:
    12px 0;
}

.data-row small {

  display: block;

  margin-bottom: 4px;

  color: #777;

  font-size: 9px;

  font-weight: 800;
}

.data-row strong {

  display: block;

  font-size: 12px;

  line-height: 1.5;

  word-break: break-word;
}

.edit {

  display: block;

  margin-top: 16px;

  padding: 12px;

  border-radius: 12px;

  text-align: center;

  background: #171717;

  color: #f4d98b;

  font-size: 10px;

  font-weight: 900;
}

.row {

  display: flex;

  justify-content:
    space-between;

  gap: 15px;

  margin: 11px 0;

  font-size: 12px;
}

.row span {

  color: #888;
}

.total {

  padding-top: 13px;

  margin-top: 15px;

  border-top:
    1px solid #292929;

  font-size: 15px;

  font-weight: 900;
}

.total strong {

  color: #f4d98b;

  font-size: 20px;
}

.pay {

  width: 100%;

  min-height: 52px;

  margin-top: 20px;

  border: 0;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #f4d98b,
      #d6ad55
    );

  color: #080808;

  font-size: 13px;

  font-weight: 900;
}

.note {

  margin-top: 12px;

  color: #666;

  text-align: center;

  font-size: 10px;

  line-height: 1.6;
}

</style>

</head>

<body>

<div class="page">

  <div class="top">

    <a
      href="index.html"
      class="logo"
    >
      SCANBELI
    </a>

    <a
      href="scan.html"
      class="back"
    >
      ← Scan
    </a>

  </div>


  <div
    id="loading"
    class="loading"
  >
    Memuat produk...
  </div>


  <div
    id="error"
    class="error hidden"
  ></div>


  <main
    id="checkout"
    class="hidden"
  >


    <!-- PRODUK -->

    <section class="card product">

      <div class="badge">
        PRODUK
      </div>

      <h1 id="productName">
        -
      </h1>

      <div
        id="productCode"
        class="product-code"
      ></div>

      <div
        id="productPrice"
        class="price"
      >
        Rp0
      </div>

    </section>


    <!-- PEMBELI -->

    <section class="card">

      <div class="badge">
        PENGIRIMAN
      </div>

      <h2 class="card-title">
        📍 Dikirim ke
      </h2>


      <div class="data-row">

        <small>
          NAMA
        </small>

        <strong id="buyerName">
          -
        </strong>

      </div>


      <div class="data-row">

        <small>
          WHATSAPP
        </small>

        <strong id="buyerPhone">
          -
        </strong>

      </div>


      <div class="data-row">

        <small>
          ALAMAT
        </small>

        <strong id="buyerAddress">
          -
        </strong>

      </div>


      <a
        href="buyer.html"
        class="edit"
      >
        ✏️ UBAH DATA PEMBELI
      </a>

    </section>


    <!-- RINGKASAN -->

    <section class="card">

      <div class="badge">
        RINGKASAN
      </div>


      <div class="row">

        <span>
          Harga produk
        </span>

        <strong id="summaryPrice">
          Rp0
        </strong>

      </div>


      <div class="row">

        <span>
          Fee SCANBELI
        </span>

        <strong id="summaryFee">
          Rp0
        </strong>

      </div>


      <div class="row total">

        <span>
          Total
        </span>

        <strong id="summaryTotal">
          Rp0
        </strong>

      </div>


      <button
        id="payButton"
        class="pay"
        type="button"
      >
        BAYAR
      </button>


      <div class="note">

        Setelah pembayaran berhasil,
        pesanan akan dibuat.

      </div>

    </section>

  </main>

</div>


<script>

const BUYER_KEY =
  "scanbeli_buyer_v1";

const ORDERS_KEY =
  "scanbeli_orders_v1";


const params =
  new URLSearchParams(
    window.location.search
  );


const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const checkout =
  document.getElementById("checkout");


function rupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(
    Number(value) || 0
  );

}


function showError(message) {

  loading.classList.add(
    "hidden"
  );

  errorBox.textContent =
    message;

  errorBox.classList.remove(
    "hidden"
  );

}


function decodeProduct(raw) {

  try {

    const normalized =
      raw
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    return JSON.parse(
      atob(normalized)
    );

  } catch (error) {

    try {

      return JSON.parse(
        decodeURIComponent(raw)
      );

    } catch (error2) {

      return null;

    }

  }

}


function loadCheckout() {

  const raw =
    params.get("product");


  if (!raw) {

    showError(
      "Data produk tidak ditemukan di QR."
    );

    return;

  }


  const product =
    decodeProduct(raw);


  if (!product) {

    showError(
      "Data produk pada QR tidak valid."
    );

    return;

  }


  let buyer = null;


  try {

    buyer =
      JSON.parse(
        localStorage.getItem(
          BUYER_KEY
        ) || "null"
      );

  } catch (error) {

    buyer = null;

  }


  /*
   * BELUM ADA DATA PEMBELI
   */

  if (
    !buyer ||
    !buyer.name ||
    !buyer.phone ||
    !buyer.address
  ) {

    localStorage.setItem(
      "scanbeli_return_url",
      window.location.href
    );

    window.location.href =
      "buyer.html";

    return;

  }


  const productName =
    product.name ||
    product.nama ||
    "Produk";


  const price =
    Number(
      product.price ??
      product.harga ??
      0
    );


  const fee =
    Math.round(
      price * 0.01
    );


  const total =
    price + fee;


  document.getElementById(
    "productName"
  ).textContent =
    productName;


  document.getElementById(
    "productCode"
  ).textContent =
    product.code
      ? "Kode: " + product.code
      : "";


  document.getElementById(
    "productPrice"
  ).textContent =
    rupiah(price);


  document.getElementById(
    "buyerName"
  ).textContent =
    buyer.name;


  document.getElementById(
    "buyerPhone"
  ).textContent =
    buyer.phone;


  document.getElementById(
    "buyerAddress"
  ).textContent =
    buyer.address;


  document.getElementById(
    "summaryPrice"
  ).textContent =
    rupiah(price);


  document.getElementById(
    "summaryFee"
  ).textContent =
    rupiah(fee);


  document.getElementById(
    "summaryTotal"
  ).textContent =
    rupiah(total);


  loading.classList.add(
    "hidden"
  );


  checkout.classList.remove(
    "hidden"
  );


  document.getElementById(
    "payButton"
  ).addEventListener(
    "click",
    function() {

      createOrder({
        product,
        buyer,
        price,
        fee,
        total
      });

    }
  );

}


function createOrder(data) {

  const orderId =
    "SB-" +
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();


  const order = {

    orderId,

    product: {

      name:
        data.product.name ||
        data.product.nama ||
        "Produk",

      code:
        data.product.code ||
        "",

    },

    buyer: {

      name:
        data.buyer.name,

      phone:
        data.buyer.phone,

      address:
        data.buyer.address

    },

    price:
      data.price,

    fee:
      data.fee,

    total:
      data.total,

    status:
      "MENUNGGU_PEMBAYARAN",

    createdAt:
      new Date().toISOString()

  };


  let orders = [];

  try {

    orders =
      JSON.parse(
        localStorage.getItem(
          ORDERS_KEY
        ) || "[]"
      );

  } catch (error) {

    orders = [];

  }


  orders.unshift(order);


  localStorage.setItem(
    ORDERS_KEY,
    JSON.stringify(orders)
  );


  window.location.href =
    "orders.html?order=" +
    encodeURIComponent(orderId);

}


loadCheckout();

</script>

</body>
</html>
