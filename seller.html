<script>
function convertGoogleDriveImageUrl(url) {
  if (!url) return "";

  url = url.trim();

  // Format:
  // https://drive.google.com/file/d/FILE_ID/view
  let match = url.match(
    /drive\.google\.com\/file\/d\/([^/]+)/
  );

  if (match && match[1]) {
    return `https://drive.google.com/thumbnail?id=${match[1]}`;
  }

  // Format:
  // https://drive.google.com/open?id=FILE_ID
  match = url.match(
    /drive\.google\.com\/open\?id=([^&]+)/
  );

  if (match && match[1]) {
    return `https://drive.google.com/thumbnail?id=${match[1]}`;
  }

  // Format thumbnail yang sudah benar
  if (
    url.includes("drive.google.com/thumbnail?id=")
  ) {
    return url;
  }

  // URL gambar biasa
  return url;
}
</script>
