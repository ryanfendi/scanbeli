<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Buat QR - SCANBELI</title>

  <link rel="stylesheet" href="style.css">

  <!-- Library QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<header class="header">

  <div class="logo">
    <span>B</span>
    SCANBELI
  </div>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="buyer.html">Data Pembeli</a>
    <a href="seller-orders.html">Pesanan Masuk</a>
  </nav>

</header>


<main class="container">

  <div class="card">

    <h1>Buat QR Produk</h1>

    <p>
      Buat QR untuk produk Anda.
      Pembeli cukup scan QR untuk membuka checkout.
    </p>


    <form id="sellerForm">

      <div class="form-group">

        <label for="productName">
          Nama Produk
        </label>

        <input
          type="text"
          id="productName"
          placeholder="Contoh: Kaos Anime"
          maxlength="100"
          required
        >

      </div>


      <div class="form-group">

        <label for="productPrice">
          Harga
        </label>

        <input
          type="number"
          id="productPrice"
          placeholder="100000"
          min="1"
          required
        >

      </div>


      <div class="form-group">

        <label for="productCode">
          Kode Produk
          <small>(opsional)</small>
        </label>

        <input
          type="text"
          id="productCode"
          placeholder="Contoh: KAOS-001"
          maxlength="50"
        >

      </div>


      <button
        type="submit"
        id="createQRButton"
        class="btn"
      >
        Buat QR
      </button>

    </form>

  </div>


  <!-- HASIL QR -->

  <div
    id="qrResult"
    class="card"
    style="display:none;"
  >

    <h2>QR Produk</h2>

    <div
      id="qrcode"
      style="
        display:flex;
        justify-content:center;
        margin:20px 0;
      "
    ></div>

    <p>
      Scan QR ini untuk membuka halaman checkout.
    </p>

    <div id="checkoutLink"></div>

  </div>


  <!-- ERROR -->

  <div
    id="errorBox"
    class="card"
    style="
      display:none;
      color:red;
    "
  ></div>

</main>


<script
  type="module"
  src="script.js"
></script>

</body>
</html>
