<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buat QR Produk - SCANBELI</title>

  <link rel="stylesheet" href="style.css">

  <!-- QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        SCANBELI
      </a>

      <nav class="nav">
        <a href="index.html">Beranda</a>
        <a href="buyer.html">Data Pembeli</a>
        <a href="seller-orders.html">Pesanan Masuk</a>
      </nav>

    </div>
  </header>


  <!-- MAIN -->
  <main class="container page-container">

    <section class="page-header">
      <h1>Buat QR Produk</h1>

      <p>
        Buat QR untuk produk Anda.
        Pembeli cukup scan QR untuk membuka checkout.
      </p>
    </section>


    <!-- FORM -->
    <section class="card">

      <form id="sellerForm">

        <div class="form-group">
          <label for="productName">
            Nama Produk
          </label>

          <input
            type="text"
            id="productName"
            placeholder="Contoh: Kaos Anime"
            maxlength="100"
            required
          >
        </div>


        <div class="form-group">
          <label for="productPrice">
            Harga Produk
          </label>

          <input
            type="number"
            id="productPrice"
            placeholder="100000"
            min="1"
            required
          >
        </div>


        <div class="form-group">
          <label for="productCode">
            Kode Produk
            <span>(opsional)</span>
          </label>

          <input
            type="text"
            id="productCode"
            placeholder="Contoh: KAOS001"
            maxlength="50"
          >
        </div>


        <!-- FIREBASE STATUS -->
        <div
          id="firebaseStatus"
          class="status-box"
          style="display:none;"
        >
          <span id="firebaseStatusText"></span>
        </div>


        <!-- ERROR -->
        <div
          id="errorBox"
          class="error-box"
          style="display:none;"
        >
          <span id="errorMessage"></span>
        </div>


        <button
          type="submit"
          id="createQRButton"
          class="btn btn-primary"
        >
          Buat QR
        </button>

      </form>

    </section>


    <!-- HASIL QR -->
    <section
      id="qrResult"
      class="card qr-result"
      style="display:none;"
    >

      <h2>QR Produk Berhasil Dibuat</h2>

      <div id="qrProductInfo"></div>

      <div
        id="qrcode"
        class="qrcode-container"
      ></div>


      <div class="form-group">

        <label for="checkoutLink">
          Link Checkout
        </label>

        <input
          type="text"
          id="checkoutLink"
          readonly
        >

      </div>


      <button
        type="button"
        id="copyLinkButton"
        class="btn btn-secondary"
      >
        Salin Link
      </button>

    </section>

  </main>


  <!-- SCRIPT SELLER -->
  <script type="module">

    import { initAnonymousAuth } from "./firebase.js";


    const sellerForm =
      document.getElementById("sellerForm");

    const productName =
      document.getElementById("productName");

    const productPrice =
      document.getElementById("productPrice");

    const productCode =
      document.getElementById("productCode");

    const createQRButton =
      document.getElementById("createQRButton");

    const qrResult =
      document.getElementById("qrResult");

    const qrCode =
      document.getElementById("qrcode");

    const qrProductInfo =
      document.getElementById("qrProductInfo");

    const checkoutLink =
      document.getElementById("checkoutLink");

    const copyLinkButton =
      document.getElementById("copyLinkButton");

    const firebaseStatus =
      document.getElementById("firebaseStatus");

    const firebaseStatusText =
      document.getElementById("firebaseStatusText");

    const errorBox =
      document.getElementById("errorBox");

    const errorMessage =
      document.getElementById("errorMessage");


    let sellerUser = null;


    // ==============================
    // FIREBASE
    // ==============================

    async function initSeller() {

      try {

        firebaseStatus.style.display = "block";

        firebaseStatusText.textContent =
          "Menghubungkan...";

        sellerUser =
          await initAnonymousAuth();

        firebaseStatusText.textContent =
          "Siap membuat QR.";

        setTimeout(() => {
          firebaseStatus.style.display = "none";
        }, 1500);

      } catch (error) {

        console.error(error);

        firebaseStatusText.textContent =
          "Firebase gagal terhubung.";

        errorBox.style.display = "block";

        errorMessage.textContent =
          error.message || "Firebase gagal terhubung.";

      }

    }


    // ==============================
    // ENCODE PRODUK
    // ==============================

    function encodeProduct(product) {

      const json =
        JSON.stringify(product);

      const bytes =
        new TextEncoder().encode(json);

      let binary = "";

      bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
      });

      return btoa(binary);

    }


    // ==============================
    // BUAT QR
    // ==============================

    sellerForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        errorBox.style.display = "none";

        const name =
          productName.value.trim();

        const price =
          Number(productPrice.value);

        const code =
          productCode.value.trim();


        if (!name) {

          errorBox.style.display = "block";

          errorMessage.textContent =
            "Nama produk wajib diisi.";

          return;

        }


        if (!price || price <= 0) {

          errorBox.style.display = "block";

          errorMessage.textContent =
            "Harga produk tidak valid.";

          return;

        }


        try {

          createQRButton.disabled = true;

          createQRButton.textContent =
            "Membuat QR...";


          // Pastikan seller mempunyai UID
          if (!sellerUser) {

            sellerUser =
              await initAnonymousAuth();

          }


          const product = {

            name: name,

            price: price,

            code: code,

            sellerUid: sellerUser.uid

          };


          /*
           * URL otomatis mengikuti
           * GitHub Pages Anda.
           *
           * Tidak perlu memasukkan URL manual.
           */

          const url =
            new URL(
              "checkout.html",
              window.location.href
            );


          url.searchParams.set(
            "product",
            encodeProduct(product)
          );


          const checkoutUrl =
            url.href;


          // Bersihkan QR lama
          qrCode.innerHTML = "";


          // Buat QR
          new QRCode(
            qrCode,
            {
              text: checkoutUrl,
              width: 240,
              height: 240,
              correctLevel:
                QRCode.CorrectLevel.M
            }
          );


          // Informasi produk
          qrProductInfo.innerHTML = `

            <div class="product-preview">

              <strong>${escapeHTML(name)}</strong>

              <span>
                Rp ${formatRupiah(price)}
              </span>

              ${
                code
                  ? `<small>Kode: ${escapeHTML(code)}</small>`
                  : ""
              }

            </div>

          `;


          checkoutLink.value =
            checkoutUrl;


          qrResult.style.display =
            "block";


          // Scroll ke QR
          qrResult.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });


        } catch (error) {

          console.error(error);

          errorBox.style.display =
            "block";

          errorMessage.textContent =
            error.message ||
            "Gagal membuat QR.";

        } finally {

          createQRButton.disabled =
            false;

          createQRButton.textContent =
            "Buat QR";

        }

      }
    );


    // ==============================
    // SALIN LINK
    // ==============================

    copyLinkButton.addEventListener(
      "click",
      async function() {

        try {

          await navigator.clipboard.writeText(
            checkoutLink.value
          );

          copyLinkButton.textContent =
            "✓ Link Disalin";

          setTimeout(() => {

            copyLinkButton.textContent =
              "Salin Link";

          }, 1500);

        } catch (error) {

          checkoutLink.select();

          document.execCommand("copy");

          copyLinkButton.textContent =
            "✓ Link Disalin";

          setTimeout(() => {

            copyLinkButton.textContent =
              "Salin Link";

          }, 1500);

        }

      }
    );


    // ==============================
    // FORMAT RUPIAH
    // ==============================

    function formatRupiah(number) {

      return new Intl.NumberFormat(
        "id-ID"
      ).format(number);

    }


    // ==============================
    // ESCAPE HTML
    // ==============================

    function escapeHTML(value) {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }


    // ==============================
    // START
    // ==============================

    initSeller();

  </script>

</body>
</html>
