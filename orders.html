<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#070707"
>

<title>Pesanan Saya — SCANBELI</title>

<link rel="stylesheet" href="style.css">

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(214,173,85,0.18),
      transparent 40%
    ),
    #070707;

  color: #fff;

  font-family:
    Inter,
    system-ui,
    sans-serif;
}

.page {

  width:
    calc(100% - 24px);

  max-width: 700px;

  margin: auto;

  padding:
    18px 0 70px;
}

.top {

  display: flex;

  align-items: center;

  justify-content:
    space-between;
}

.logo {

  color: #f4d98b;

  font-size: 20px;

  font-weight: 900;

  letter-spacing: 2px;
}

.back {

  color: #999;

  font-size: 11px;
}

.hero {

  padding:
    35px 0 20px;

  text-align: center;
}

.badge {

  display: inline-block;

  padding:
    7px 11px;

  border-radius: 30px;

  background:
    rgba(214,173,85,0.08);

  border:
    1px solid
    rgba(214,173,85,0.18);

  color: #f4d98b;

  font-size: 9px;

  font-weight: 900;
}

.hero h1 {

  margin:
    14px 0 7px;

  font-size: 34px;

  letter-spacing: -1.5px;
}

.hero p {

  color: #888;

  font-size: 12px;
}

.card {

  margin-top: 13px;

  padding: 20px;

  border-radius: 20px;

  background:
    linear-gradient(
      145deg,
      rgba(214,173,85,0.07),
      #111
    );

  border:
    1px solid
    rgba(214,173,85,0.14);
}

.order-head {

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap: 10px;
}

.product {

  font-size: 16px;

  font-weight: 900;
}

.order-number {

  margin-top: 5px;

  color: #777;

  font-size: 10px;
}

.status {

  padding:
    7px 9px;

  border-radius: 20px;

  background:
    rgba(214,173,85,0.08);

  color: #f4d98b;

  font-size: 9px;

  font-weight: 900;

  white-space: nowrap;
}

.rows {

  margin-top: 17px;

  padding-top: 13px;

  border-top:
    1px solid #252525;
}

.row {

  display: flex;

  justify-content:
    space-between;

  gap: 15px;

  margin: 10px 0;

  font-size: 11px;
}

.row span {

  color: #888;
}

.row strong {

  text-align: right;

  max-width: 68%;
}

.total {

  padding-top: 13px;

  border-top:
    1px solid #292929;

  font-size: 14px;
}

.total strong {

  color: #f4d98b;

  font-size: 17px;
}

.empty {

  padding: 40px 20px;

  text-align: center;

  color: #777;

  border-radius: 20px;

  background: #111;

  border:
    1px solid #222;
}

.btn {

  display: block;

  margin-top: 17px;

  padding: 14px;

  border-radius: 13px;

  text-align: center;

  background:
    linear-gradient(
      135deg,
      #f4d98b,
      #d6ad55
    );

  color: #080808;

  font-size: 10px;

  font-weight: 900;
}

</style>

</head>

<body>

<div class="page">


  <div class="top">

    <a
      href="index.html"
      class="logo"
    >
      SCANBELI
    </a>

    <a
      href="index.html"
      class="back"
    >
      ← Beranda
    </a>

  </div>


  <div class="hero">

    <div class="badge">
      📦 PESANAN SAYA
    </div>

    <h1>
      Pesanan
    </h1>

    <p>
      Riwayat pesanan dari perangkat ini.
    </p>

  </div>


  <div id="orders"></div>


</div>


<script>

const ORDERS_KEY =
  "scanbeli_orders_v1";


const container =
  document.getElementById(
    "orders"
  );


function rupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(
    Number(value) || 0
  );

}


function escapeHTML(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(char) {

      return {

        "&": "&amp;",

        "<": "&lt;",

        ">": "&gt;",

        '"': "&quot;",

        "'": "&#039;"

      }[char];

    }
  );

}


function statusText(status) {

  const map = {

    MENUNGGU_PEMBAYARAN:
      "Menunggu Pembayaran",

    DIBAYAR:
      "Sudah Dibayar",

    DIPROSES:
      "Sedang Diproses",

    DIKIRIM:
      "Dikirim",

    SELESAI:
      "Selesai",

    DIBATALKAN:
      "Dibatalkan"

  };

  return (
    map[status] ||
    status ||
    "Tidak diketahui"
  );

}


function loadOrders() {

  let orders = [];

  try {

    orders =
      JSON.parse(
        localStorage.getItem(
          ORDERS_KEY
        ) || "[]"
      );

  } catch (error) {

    orders = [];

  }


  if (!orders.length) {

    container.innerHTML = `

      <div class="empty">

        Belum ada pesanan.

        <a
          href="scan.html"
          class="btn"
        >
          📷 SCAN PRODUK
        </a>

      </div>

    `;

    return;

  }


  container.innerHTML =
    orders.map(
      function(order) {

        const product =
          order.product || {};

        const buyer =
          order.buyer || {};

        return `

          <div class="card">

            <div class="order-head">

              <div>

                <div class="product">

                  ${escapeHTML(
                    product.name ||
                    "Produk"
                  )}

                </div>

                <div class="order-number">

                  Order:
                  <b>
                    ${escapeHTML(
                      order.orderId ||
                      order.id
                    )}
                  </b>

                </div>

              </div>


              <div class="status">

                ${escapeHTML(
                  statusText(
                    order.status
                  )
                )}

              </div>

            </div>


            <div class="rows">

              <div class="row">

                <span>
                  Nama
                </span>

                <strong>
                  ${escapeHTML(
                    buyer.name
                  )}
                </strong>

              </div>


              <div class="row">

                <span>
                  WhatsApp
                </span>

                <strong>
                  ${escapeHTML(
                    buyer.phone
                  )}
                </strong>

              </div>


              <div class="row">

                <span>
                  Alamat
                </span>

                <strong>
                  ${escapeHTML(
                    buyer.address
                  )}
                </strong>

              </div>


              <div class="row">

                <span>
                  Harga Produk
                </span>

                <strong>
                  ${rupiah(
                    order.price
                  )}
                </strong>

              </div>


              <div class="row">

                <span>
                  Fee SCANBELI
                </span>

                <strong>
                  ${rupiah(
                    order.fee
                  )}
                </strong>

              </div>


              <div class="row total">

                <span>
                  Total
                </span>

                <strong>
                  ${rupiah(
                    order.total
                  )}
                </strong>

              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


loadOrders();

</script>

</body>
</html>
